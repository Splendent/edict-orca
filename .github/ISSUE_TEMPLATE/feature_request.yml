name: 功能提案
description: 說明需要解決的使用情境及可驗收結果
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用情境與目前限制
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 預期行為與驗收方式
      description: 描述完成後使用者能做到什麼，以及如何確認。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考慮方案與影響範圍
      description: 包含資料、權限、代理工具或平台影響；不確定可明寫。
